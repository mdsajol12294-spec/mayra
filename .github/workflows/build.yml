name: Build Jannat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workspace files
        run: |
          ls -la
          ls -la app_src || echo "app_src not added yet"

      - name: Prepare light build bundle
        run: |
          mkdir -p build_out
          tar -czf build_out/jannat_bundle.tar.gz --exclude='.git' --exclude='build_out' .
          ls -lh build_out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jannat-build-bundle
          path: build_out/*
